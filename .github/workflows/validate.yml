name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      overheadRef:
        description: Branch of katagaki/Overhead to validate against
        required: false

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out data
        uses: actions/checkout@v4
        with:
          path: OverheadData

      # validate.swift decodes against the app's real models, so this has to be
      # a ref that already has them. Override with the OVERHEAD_REF repo
      # variable while the data format is ahead of the app's main branch.
      - name: Check out app (for the data models)
        uses: actions/checkout@v4
        with:
          repository: katagaki/Overhead
          ref: ${{ inputs.overheadRef || vars.OVERHEAD_REF || 'main' }}
          path: Overhead

      - name: Catalog is up to date
        working-directory: OverheadData
        run: |
          python3 Scripts/make-catalog.py
          if ! git diff --quiet catalog.json; then
            echo "::error::catalog.json is stale — run Scripts/make-catalog.py and commit it"
            git --no-pager diff --stat catalog.json
            exit 1
          fi

      - name: Every line decodes against the app's models
        working-directory: OverheadData
        env:
          OVERHEAD_REPO: ${{ github.workspace }}/Overhead
        run: ./Scripts/validate.swift
